name: release

# Buildea instaladores en su propio SO (Mac NO se puede cross-compilar desde
# Windows) y publica un Release de GitHub con los binarios adjuntos.
# Disparadores: push de un tag `v*` (ej. v0.1.0) o manual.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # crear el release y subir los instaladores
    strategy:
      fail-fast: false
      matrix:
        include:
          # Solo Apple Silicon. NO universal: `ort` (los bindings de ONNX
          # Runtime que arrastra la separacion de voz) publica un xcframework
          # con slices arm64 pero NO x86_64, asi que la mitad Intel no compila
          # y voltea el job entero. Las Mac Intel quedan sin soporte.
          - platform: macos-latest # .dmg para Apple Silicon
            args: --target aarch64-apple-darwin
            sidecarTriple: aarch64-apple-darwin
          - platform: windows-latest # .msi (WiX) + .exe (NSIS)
            args: ""
            sidecarTriple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      # externalBin apunta a binarios que no estan en el repo (115 MB): sin este
      # paso `tauri build` falla porque no los encuentra.
      - name: Fetch sidecars
        run: bun run sidecar:fetch --triple ${{ matrix.sidecarTriple }}

      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # __VERSION__ ← version de tauri.conf.json
          releaseName: "Ruta Tonal v__VERSION__"
          releaseBody: "Instaladores para Windows (.msi / .exe) y macOS Apple Silicon (.dmg). Descargá el que corresponda a tu sistema desde los assets de abajo."
          releaseDraft: true # queda en borrador para que lo revises y publiques
          prerelease: false
          args: ${{ matrix.args }}
